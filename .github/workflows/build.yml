name: Build Stalwart FoundationDB

on:
  workflow_dispatch:
    inputs:
      stalwart_ref:
        description: "Stalwart Git tag / branch / commit"
        required: true
        default: "main"

env:
  IMAGE_NAME: ${{ github.repository }}
  FDB_VERSION: "7.4.6"

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Stalwart source
        uses: actions/checkout@v4
        with:
          repository: stalwartlabs/stalwart
          ref: ${{ inputs.stalwart_ref }}
          fetch-depth: 1

      - name: Read Stalwart version
        id: version
        shell: bash
        run: |
          VERSION=$(grep '^version = ' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          echo "Stalwart version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set image tag
        id: tag
        shell: bash
        run: |
          TAG="${{ steps.version.outputs.version }}-fdb${{ env.FDB_VERSION }}"
          echo "Image tag: $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push FoundationDB image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.fdb
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.tag }}
            ghcr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
